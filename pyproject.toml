[project]
name = "prusaslicer-mcp"
version = "0.2.0"
description = "MCP server that lets Claude drive the PrusaSlicer 2.9.x CLI"
readme = "README.md"
authors = [
    { name = "Sebastien Coutu", email = "sebastien.coutu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "mcp>=1.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "trimesh>=5.2.1",
]

[project.scripts]
prusaslicer-mcp = "prusaslicer_mcp:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "--strict-markers"
markers = [
    "integration: needs a real PrusaSlicer install; added automatically to any test that uses the `prusaslicer` fixture",
]

[tool.coverage.run]
source = ["prusaslicer_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
# Unit tests alone reach about 99%; the floor catches a real regression without flapping on one line.
fail_under = 95

# `uv format` formats with Ruff 0.15.x, so the dev dependency is constrained to the same range to keep the
# linter and the formatter in agreement.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PT", "ASYNC", "RUF", "C4", "PIE", "RET"]
ignore = [
    "E501",     # long lines are left to the formatter; it cannot split long strings and comments
    "ASYNC109", # cli.run keeps an explicit `timeout` parameter on purpose
    "ASYNC240", # small local pathlib calls inside async tools are not worth a thread hop
]

# Two checkers on purpose: `ty` (what `uv check` runs) is pre-1.0 and has missed real errors, pyright is mature
# (ADR 0010). The interpreter is the one `uv run` puts first on PATH, so no venv is configured here.
[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["scripts"]  # the dogfood package lives there and is imported as `dogfood`

[tool.ty.environment]
extra-paths = ["scripts"]  # same, for `uv check`

# Task runner: `uv run poe <task>`. uv has no task runner, so Poe only chains uv's own commands and the tools
# CI also runs; CI calls these same tasks so local and CI checks cannot drift apart.
[tool.poe.tasks]
lint = { cmd = "ruff check", help = "Lint with Ruff" }
lint-fix = { cmd = "ruff check --fix", help = "Lint and apply safe fixes" }
format = { cmd = "uv format", help = "Format with Ruff (via uv format)" }
format-check = { cmd = "uv format --check", help = "Fail if any file needs formatting" }
typecheck-ty = { cmd = "uv check --ty-version 0.0.104", help = "Type-check with ty (uv check), pinned because ty is pre-1.0" }
typecheck-pyright = { cmd = "pyright", help = "Type-check with pyright" }
typecheck = { sequence = ["typecheck-ty", "typecheck-pyright"], help = "Type-check with both checkers" }
audit = { cmd = "uv audit", help = "Check locked dependencies for known vulnerabilities" }
test = { cmd = "pytest -m 'not integration'", help = "Unit tests; no PrusaSlicer needed" }
test-integration = { cmd = "pytest -m integration", help = "Integration tests; need a real PrusaSlicer" }
test-all = { cmd = "pytest", help = "Every test (integration tests skip when PrusaSlicer is absent)" }
cov = { cmd = "pytest -m 'not integration' --cov", help = "Unit tests with a coverage report" }
check = { sequence = ["lint", "format-check", "typecheck", "test"], help = "Everything CI checks, apart from integration tests" }
fix = { sequence = ["lint-fix", "format"], help = "Apply safe lint fixes, then format" }
dogfood = { cmd = "python -m dogfood.sweep", env = { PYTHONPATH = "scripts" }, help = "Run every tool over a folder of models: `poe dogfood run <folder>` (docs/dogfooding.md)" }
