[project]
name = "prusaslicer-mcp"
version = "0.1.0"
description = "MCP server that lets Claude drive the PrusaSlicer 2.9.x CLI"
readme = "README.md"
authors = [
    { name = "Sebastien Coutu", email = "sebastien.coutu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "mcp>=1.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "trimesh>=5.2.1",
]

[project.scripts]
prusaslicer-mcp = "prusaslicer_mcp:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
