name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never let CI silently re-resolve dependencies: a stale uv.lock must fail the build.
  UV_LOCKED: "1"
  # uv 0.12 ships experimental `format` and `check` commands; pinning keeps their behaviour (and the Ruff
  # version `uv format` uses) identical to local runs until we choose to bump it.
  UV_VERSION: "0.12.9"
  # Single place to change the PrusaSlicer version the integration tests run against. The downloaded
  # installer is cached under a key that includes it, so a bump costs one download and is then cached again.
  PRUSASLICER_VERSION: "2.9.7"

jobs:
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: uv run poe lint
      - run: uv run poe format-check

  typecheck:
    name: type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: uv run poe typecheck

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv run poe audit

  unit:
    name: unit tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every supported version: the floor (requires-python) up to the one we develop on.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync
      # Needs no PrusaSlicer: its command line is faked, and the stdio tests start the real server.
      - run: uv run poe cov

  integration:
    name: integration tests (PrusaSlicer on macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: Cache the PrusaSlicer download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prusaslicer/PrusaSlicer-${{ env.PRUSASLICER_VERSION }}.dmg
          key: prusaslicer-dmg-${{ env.PRUSASLICER_VERSION }}
      - name: Install PrusaSlicer and a throwaway data directory
        run: .github/scripts/setup-prusaslicer-macos.sh "$PRUSASLICER_VERSION" "$RUNNER_TEMP/prusaslicer"
      - run: uv run poe test-integration

  # Windows is not an afterthought: the code has Windows-specific paths (install folders, the console build) that
  # only a Windows machine can prove. Unit tests run on the supported floor; the real PrusaSlicer is the portable zip.
  unit-windows:
    name: unit tests (windows, python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # Not `poe test`: its quoting of the marker expression is written for a POSIX shell.
      - run: uv run pytest -m "not integration"

  integration-windows:
    name: integration tests (PrusaSlicer on Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: Cache the PrusaSlicer download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\prusaslicer\PrusaSlicer-${{ env.PRUSASLICER_VERSION }}.zip
          key: prusaslicer-zip-${{ env.PRUSASLICER_VERSION }}
      - name: Unpack PrusaSlicer and make a throwaway data directory
        run: .github/scripts/setup-prusaslicer-windows.ps1 -Version $env:PRUSASLICER_VERSION -WorkDir "$env:RUNNER_TEMP\prusaslicer"
      - run: uv run pytest -m integration

  # The published metadata promises that every dependency's lower bound works. Prove it: resolve each direct
  # dependency to its lowest allowed version and run the unit tests (this is how `mcp>=1.2` was found to be wrong).
  lowest:
    name: unit tests (lowest dependency versions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      # Not `uv run`: UV_LOCKED would forbid resolving. The test tools get their real floors from the dev group.
      - run: >
          uv run --no-project --isolated --resolution lowest-direct --with-editable .
          --with 'pytest>=9.2.0' --with 'pytest-asyncio>=1.5.0'
          python -m pytest -m "not integration" -q -p no:cacheprovider
        env:
          UV_LOCKED: "0"

  # Builds what would go to PyPI and installs it into a clean environment, so a broken package (missing metadata,
  # a file left out of the wheel, a dependency bound that does not resolve) fails here and not on release day.
  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Install the wheel somewhere that is not the checkout, and import it
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -I -c "import prusaslicer_mcp; print(prusaslicer_mcp.main)"
          test -x "$RUNNER_TEMP/venv/bin/prusaslicer-mcp"
      - name: Check the metadata PyPI will show
        run: uvx twine check --strict "$RUNNER_TEMP"/dist/*

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs

  # One stable check for branch protection to require. GitHub names checks after jobs, not workflows, so requiring
  # "ci" would otherwise wait forever. This job also keeps the ruleset valid when jobs above are renamed or added.
  ci:
    name: ci
    if: always()
    needs: [lint, typecheck, audit, unit, unit-windows, lowest, integration, integration-windows, package, commitlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "at least one job did not succeed" >&2
              exit 1
            fi
          done
